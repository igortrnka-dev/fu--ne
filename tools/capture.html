<!doctype html>
<!-- Helper for screenshots narrower than Chrome's minimum window width.
     Usage: tools/capture.html?src=../dashboard.html%3Fshot%3Dfull&w=390&h=844 -->
<html>
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <style>html, body { margin: 0; background: #161719; overflow: hidden; } iframe { border: 0; display: block; margin: 0 auto; }</style>
</head>
<body>
  <iframe id="f" title="capture"></iframe>
  <script>
    const p = new URLSearchParams(location.search);
    const f = document.getElementById('f');
    f.style.width = (p.get('w') || 390) + 'px';
    f.style.height = (p.get('h') || 844) + 'px';
    f.src = p.get('src') || '../dashboard.html?shot=full';
  </script>
</body>
</html>
